name: em_budget
description: "EM Budget mobile client. Parity port of the web app; no independent business logic."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  build_runner: ^2.16.1
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
