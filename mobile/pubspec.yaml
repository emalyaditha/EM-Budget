name: em_budget
description: "EM Budget mobile client. Parity port of the web app; no independent business logic."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cookie_jar: 4.0.9
  dio: 5.11.1
  dio_cookie_manager: 3.5.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  local_auth: ^3.0.2
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
