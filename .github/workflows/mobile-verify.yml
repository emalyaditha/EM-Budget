name: Mobile Parity CI

# Mirrors the gates in verify-build.yml for the Flutter client only. The two jobs are
# independent: a mobile change must not block a web deploy, and vice versa. gitleaks
# already runs over the whole tree in the web job, so mobile/ is secret-scanned there.

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # Third-party action, pinned to the full commit SHA rather than the floating `v2`
      # tag. That commit is v2.23.0 as of 2026-10-06; bump it deliberately, never by
      # tag drift.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true
      # mobile/android/build.gradle.kts compiles to Java 17; pinning the JDK keeps the
      # build from tracking whatever the runner image happens to ship.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Lint (zero warnings)
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Tests
        run: flutter test
      # The only place this repository ever proves the app compiles: this host has no
      # Android SDK, and iOS builds need macOS, so `analyze` + `test` alone would let a
      # plugin that requires native configuration pass silently.
      - name: Android debug build
        run: flutter build apk --debug

  # `LOGIC_SPEC.md` §5/§8: `installments.ts` and `alerts.ts` both reach for `Date.now()`
  # when no reference instant is passed, and the web's own schedule math mixes local
  # midnight with UTC arithmetic. The Dart ports take an injected clock instead, so the
  # suites must be able to run anywhere and produce the same goldens. Ubuntu's ICU and
  # glibc both honour `TZ`, which is what makes this check possible — the Dart VM on
  # **Windows ignores `TZ`** and follows the OS zone, so it can never be run here
  # (`parity/fixtures/tz-proof.ts` is the web-side half of the same argument, run under Node).
  timezone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A single zone drifting must not hide the other two.
      fail-fast: false
      matrix:
        # The app's own zone, a zone behind UTC whose DST boundary lands near the pinned
        # instant, and the furthest ahead of UTC there is (+14, which crosses the
        # international date line). ±14h spans every offset a phone can report.
        zone: ['Asia/Colombo', 'America/New_York', 'Pacific/Kiritimati']
    env:
      TZ: ${{ matrix.zone }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Prove the zone was actually applied
        run: |
          set -eu
          offset="$(date +%z)"
          echo "TZ=$TZ  ambient offset=$offset"
          # None of the three matrix zones is ever UTC, so a `+0000` here means the
          # runner ignored `TZ` and this job would be replaying the same zone three
          # times while reporting success.
          if [ "$offset" = "+0000" ]; then
            echo "::error::ambient zone is UTC; TZ=$TZ was not applied"
            exit 1
          fi
      - name: Clock-dependent units under ${{ matrix.zone }}
        # The five suites that touch a wall clock at all. `installments`/`alerts` take an
        # injected instant and must be zone-blind; `dates_local` reads the *host* zone on
        # purpose (that is the unit) and so replays its `Asia/Colombo` goldens through a
        # shift to the measurement zone — the fourth leg of that proof is the `validate`
        # job, which runs the same suite on a UTC runner and is where the unshifted replay
        # first failed.
        run: |
          flutter test \
            test/domain/installments_test.dart \
            test/domain/alerts_test.dart \
            test/data/dates_local_test.dart \
            test/data/transaction_service_test.dart \
            test/data/state_storage_test.dart
