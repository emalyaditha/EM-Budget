name: Enterprise Production Quality CI

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: npm ci
      - name: Parity fixture gate (D8 / D35)
        # The migration fixture gate ran only on a developer machine. Nothing on CI called
        # validate.ts, so a branch could carry src/ edits against stale _provenance.srcTree
        # stamps and every check still reported green — measured 2026-10-09, when
        # phase5-design-system sat in exactly that state (14 fixtures stamped 9921f3a4 under
        # a post-B-23 src/) while this job passed at 68b481f and 1996278. fetch-depth: 0 above
        # is what makes the check possible: validate.ts re-derives provenance from git, so it
        # needs the pre-flutter tag and the source blobs, not just the working tree. tsx and
        # zod already come from npm ci, so the gate adds no dependency. A red run here means a
        # re-stamp was forgotten (D35: any edit under src/ re-stamps all fourteen fixtures),
        # not that a fixture is wrong.
        run: npx tsx parity/fixtures/validate.ts
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Lint + typecheck (zero warnings)
        run: npm run lint
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Format check
        run: npx prettier --check .
      - name: Build
        run: npm run build

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run end-to-end tests
        env:
          DEV_OTP_RESPONSE: 'true'
          SESSION_SECRET: 'ci-ephemeral-session-secret-not-for-production'
        run: npm run e2e
